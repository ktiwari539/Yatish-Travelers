name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: CRM API tests
        run: npm run test:api

      - name: Type check and production build
        run: npm run build

      - name: Install browser for UI smoke tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Chromium interaction smoke
        run: node scripts/hero-ui-smoke.mjs
