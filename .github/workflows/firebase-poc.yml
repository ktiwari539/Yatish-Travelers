name: Isolated Firebase POC
on:
  push:
    branches: [experiment/netlify-firebase-free-poc]
  pull_request:
    paths: ['experiments/firebase/**', 'server/firebase/**', 'netlify/**', 'src/**', 'scripts/**', 'package*.json', '.github/workflows/firebase-poc.yml']
permissions:
  contents: read
jobs:
  emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install full CRM dependencies
        run: npm ci
      - name: Audit dependency locks
        run: |
          npm audit --audit-level=low
          npm audit --prefix experiments/firebase/integration --package-lock-only --audit-level=low
      - name: Install isolated POC tools
        run: npm ci --prefix experiments/firebase/integration
      - name: Original injected contracts
        run: node --test experiments/firebase/*.test.mjs
      - name: Runtime and HTTP boundary unit tests
        run: npm test --prefix experiments/firebase/integration
      - name: Build Web SDK sign-in preview and check server/client boundary
        run: npm run build --prefix experiments/firebase/integration
      - name: Real Auth and Firestore emulator integration plus process restart/import
        run: npm run test:emulators --prefix experiments/firebase/integration
      - name: Full CRM runtime and migration contracts
        run: node --test server/firebase/tests/*.test.mjs
      - name: Complete CRM emulator, local Blobs HTTP, encrypted restore and emulator process restart
        run: node scripts/test-firebase-crm.mjs
      - name: Retain emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-poc-emulator-diagnostics
          path: experiments/firebase/integration/*-debug.log
          retention-days: 3
          if-no-files-found: ignore
