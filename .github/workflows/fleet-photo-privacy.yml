name: Fleet Photo Privacy Sources
on:
  # Original third-party image hosts may return HTTP 429; never block
  # normal PR CI or retry on every code push.
  workflow_dispatch:

jobs:
  capture-original-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original model source images for manual privacy review
        run: python scripts/fetch_privacy_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-images-for-plate-redaction
          path: artifacts/privacy-sources
          retention-days: 7
          if-no-files-found: warn
