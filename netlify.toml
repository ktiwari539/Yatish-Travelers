[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  CRM_BACKEND = "firestore"

# Release stays blocked until offline review and explicit owner deployment approval.
[functions]
  directory = "netlify/generated-functions"
  node_bundler = "esbuild"
  # Bundle Firebase Auth and its ESM dependencies together for Lambda.
# Keep native modules and Firestore runtime-loaded assets external.
external_node_modules = ["@google-cloud/firestore", "@google-cloud/storage", "sharp"]

# Never commit secrets, CRM tokens, or customer data in Netlify config.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
